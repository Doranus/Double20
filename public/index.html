<style>
:root{
  --bg:#F1F6F7; --surface:#FFFFFF; --sunk:#EAF1F3; --line:#D3E0E4;
  --ink:#10242B; --muted:#557079; --steel:#0B8A8F; --steel-soft:#D6F1F1;
  --red:#F2545B; --green:#1FAE6B; --green-soft:#DBF5E8;
  --b1:#0B8A8F; --b1s:#D6F1F1; --b2:#6C5CE7; --b2s:#E8E5FD; --b3:#F2654B; --b3s:#FDE6E1;
  --sun:#F5A524; --hero-ink:#FFFFFF;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1F; --surface:#172429; --sunk:#1E2F35; --line:#2B4048;
    --ink:#E6F2F3; --muted:#93AEB5; --steel:#3CC9C4; --steel-soft:#173A3D;
    --red:#FF7A80; --green:#4ED494; --green-soft:#163A2A;
    --b1:#3CC9C4; --b1s:#173A3D; --b2:#9D90FF; --b2s:#28254A; --b3:#FF8A70; --b3s:#40241F;
    --sun:#FFC04D; --hero-ink:#0F1A1F;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#172429; --sunk:#1E2F35; --line:#2B4048;
  --ink:#E6F2F3; --muted:#93AEB5; --steel:#3CC9C4; --steel-soft:#173A3D;
  --red:#FF7A80; --green:#4ED494; --green-soft:#163A2A;
  --b1:#3CC9C4; --b1s:#173A3D; --b2:#9D90FF; --b2s:#28254A; --b3:#FF8A70; --b3s:#40241F;
  --sun:#FFC04D; --hero-ink:#0F1A1F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 2px 14px}
header.top h1{font-family:var(--cond);font-weight:700;font-size:28px;letter-spacing:.2px;margin:0}
.sync{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.h2{font-family:var(--cond);font-weight:600;font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}

/* Session header */
.sess-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px}
.iconbtn:disabled{opacity:.35;cursor:default}
.sess-title{text-align:center;flex:1}
.sess-title .wk{font-family:var(--cond);font-size:15px;color:var(--muted);font-weight:600}
.sess-title .nm{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--green-soft);color:var(--green);margin-top:4px}
.note{background:var(--steel-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}

/* Sets */
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--sunk);border:1px solid transparent;transition:background .15s,border-color .15s}
.set.done{background:var(--green-soft);border-color:var(--green)}
.set .n{font-family:var(--cond);font-weight:600;color:var(--muted);text-align:center;font-size:18px}
.field{display:flex;flex-direction:column}
.field label{font-size:11px;color:var(--muted);margin-bottom:2px}
.field input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-family:var(--cond);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tick{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:22px;display:grid;place-items:center;color:transparent}
.set.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.target{font-size:12px;color:var(--muted);grid-column:2/4;margin-top:-4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.done{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.full{width:100%;font-size:17px;min-height:52px}

/* Timer */
.timer{display:flex;align-items:center;gap:10px;justify-content:space-between}
.timer .clock{font-family:var(--cond);font-weight:700;font-size:40px;font-variant-numeric:tabular-nums;min-width:96px}
.timer .clock.run{color:var(--steel)}
.timer .clock.over{color:var(--green)}

/* Accessories */
.acc{display:grid;gap:6px;margin-top:6px}
.acc label{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--sunk);font-size:15px}
.acc input{width:20px;height:20px;accent-color:var(--green)}
textarea{width:100%;min-height:72px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;resize:vertical}
select,.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Plan */
.block-h{font-family:var(--cond);font-weight:600;font-size:18px;margin:6px 0 2px}
.block-s{font-size:13px;color:var(--muted);margin:0 0 8px}
.week{display:grid;grid-template-columns:64px repeat(3,1fr);gap:6px;align-items:stretch;margin-bottom:6px}
.week .wl{font-family:var(--cond);font-weight:600;color:var(--muted);display:flex;align-items:center}
.week.cur .wl{color:var(--steel)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;text-align:left;min-height:56px}
.chip b{display:block;font-family:var(--cond);font-size:16px;font-weight:600}
.chip span{font-size:12px;color:var(--muted)}
.chip.done{background:var(--green-soft);border-color:var(--green)}
.chip.done span{color:var(--green)}
.chip.next{border:2px solid var(--steel)}

/* Progress */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero .big{font-family:var(--cond);font-weight:700;font-size:64px;line-height:.9}
.hero .big small{font-size:24px;font-weight:600;color:var(--muted);margin-left:4px}
.meter{position:relative;height:14px;background:var(--sunk);border-radius:99px;margin:18px 0 6px;overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--steel);border-radius:99px}
.meter .goal{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--red);border-radius:2px;right:0}
.meter-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat.s4{background:var(--green-soft)} .stat.s4 .v{color:var(--green)}
.card.hero-card.pu{background:var(--b2);border-color:var(--b2)}
.stat{background:var(--sunk);border-radius:10px;padding:10px}
.stat .v{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px}
td.num{font-size:16px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.bwlist{display:grid;gap:4px;margin-top:10px}
.bwlist div{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.bwlist button{border:0;background:none;color:var(--muted);padding:0 4px}


/* plan: push/pull rows */
.week{display:block;margin-bottom:12px}
.week .wl{font-family:var(--cond);font-weight:600;color:var(--muted);margin-bottom:4px}
.wrow{display:grid;grid-template-columns:40px repeat(3,1fr);gap:6px;margin-bottom:6px;align-items:stretch}
.rl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center}
.rl.push,.tag.push{color:var(--b3)} .rl.pull,.tag.pull{color:var(--b2)}
.tag{font-weight:600}
.chip .dn{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.chip.pull{background:var(--b2s)} .chip.push{background:var(--surface)}
.chip.done{background:var(--green-soft)}
.chip.rest{border-style:dashed;background:transparent}
/* Floating rest timer */
.tbar{position:fixed;top:0;left:0;right:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tbar .in{max-width:720px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.tbar .tl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;line-height:1}
.tbar .clock{font-family:var(--cond);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums;min-width:78px}
.tbar .clock.run{color:var(--steel)} .tbar .clock.over{color:var(--sun)}
.tbar.alert{background:var(--sun)} .tbar.alert .clock,.tbar.alert .tl{color:#1b1b1b}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:transparent;padding:8px 10px;font-weight:600;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--steel);color:#fff}
.tgo{border:0;border-radius:10px;background:var(--steel);color:#fff;font-weight:600;padding:0 14px;min-height:40px}
.tgo.stop{background:var(--sunk);color:var(--ink)}
.wrap{padding-top:72px}
.xex{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.xhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.xhead b{font-family:var(--cond);font-size:19px;font-weight:600}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px}
.xadd{display:flex;gap:8px}.xadd .input{flex:1;min-width:0}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:8px 12px;font-weight:600;font-size:14px;min-height:38px}
.pick:hover{border-color:var(--steel)}
.cues{margin:0 0 10px}
.cues summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--steel);list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.cues summary::-webkit-details-marker{display:none}
.cues summary::before{content:"ⓘ"}
.cues ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink)}
.cues li{margin-bottom:4px}
.wu{background:var(--sunk);border-radius:12px;padding:10px;margin-bottom:10px}
.wu-h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px}
.wu-l{display:flex;flex-wrap:wrap;gap:6px}
.wu-b{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-family:var(--cond);font-weight:600;font-size:17px;min-height:38px}
.wu-b.on{background:var(--green);border-color:var(--green);color:var(--on-accent);box-shadow:0 0 12px -4px var(--green)}
.set.pr .n::after{content:"🏆";display:block;font-size:14px}
.sclock{font-family:var(--cond);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px;text-transform:none;letter-spacing:0}
.sclock.warn{color:var(--sun);text-shadow:0 0 10px var(--sun)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.prbanner{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px) scale(.9);opacity:0;z-index:41;pointer-events:none;
  background:linear-gradient(90deg,var(--b1),var(--b2),var(--b3));color:#fff;padding:14px 20px;border-radius:16px;text-align:center;box-shadow:0 0 40px -6px var(--b2);transition:all .3s cubic-bezier(.2,1.4,.4,1);min-width:240px}
.prbanner.show{opacity:1;transform:translate(-50%,0) scale(1)}
.prbanner b{display:block;font-family:var(--cond);font-size:26px;letter-spacing:.3px}
.prbanner span{font-size:14px;opacity:.95}
.coach-out{white-space:pre-wrap;font-size:15px;line-height:1.55;margin-top:12px;background:var(--sunk);border-radius:12px;padding:12px}
.coach-out:empty{display:none}
.card.coach{border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--b1),var(--b2),var(--b3)) border-box}
.cfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.cfilter::-webkit-scrollbar{display:none}
.cfilter button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.cfilter button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--on-accent);box-shadow:0 0 16px -4px var(--steel)}
.cx{border-left:5px solid var(--cc)}
.cx summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cx summary::-webkit-details-marker{display:none}
.cx .ct{font-family:var(--cond);font-weight:600;font-size:21px;line-height:1.15}
.cx .cs{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--cc);white-space:nowrap}
.cx .cw{font-size:14px;color:var(--muted);margin:4px 0 0}
.cx .chev{transition:transform .2s;color:var(--muted);font-size:18px}
.cx[open] .chev{transform:rotate(90deg)}
.cx .cbody{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.cx .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px}
.cx ul{margin:0;padding-left:18px;font-size:14px}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prog div{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:14px}
.prog b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.c-pull{--cc:var(--b2)} .c-push{--cc:var(--b3)} .c-core{--cc:var(--b1)} .c-shoulder{--cc:var(--green)}
.picks4{display:grid;gap:8px}
.picks4 div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.25)}
.picks4 div:last-child{border:0}
.ssrow{grid-column:2/5;display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.ssl{font-size:13px;font-weight:600;color:var(--b3);white-space:nowrap}
.ssrow input{width:84px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-family:var(--cond);font-size:20px;font-weight:600}
.ssu{font-size:12px;color:var(--muted)}
.sstog{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0 0 10px;color:var(--b3)}
.sstog input{width:20px;height:20px;accent-color:var(--b3)}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:12;border:0;border-radius:99px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(90deg,var(--b3),var(--b2));box-shadow:0 0 28px -6px var(--b3),0 8px 20px -10px rgba(0,0,0,.5)}
.fab b{background:rgba(255,255,255,.22);border-radius:99px;padding:3px 10px;font-family:var(--cond);font-size:17px;min-width:34px}
.fab:active{transform:scale(.96)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:720px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px -10px var(--glow);max-height:80vh;overflow:auto}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qgrid button{border:1px solid var(--line);background:var(--sunk);border-radius:12px;min-height:56px;font-family:var(--cond);font-weight:700;font-size:24px}
.qgrid button:active{background:var(--b3);color:#fff}
.view{padding-bottom:56px}
.swaprow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}
.swapped{font-size:13px;color:var(--b3);font-weight:600}
.linkbtn{border:0;background:none;color:var(--steel);font-weight:700;text-decoration:underline;padding:4px;font-size:13px}
#swaplists .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs .in button{font-size:11px;white-space:nowrap;letter-spacing:-.1px}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--steel)}
.blk1{--blk:var(--b1);--blks:var(--b1s)} .blk2{--blk:var(--b2);--blks:var(--b2s)} .blk3{--blk:var(--b3);--blks:var(--b3s)}
.card.sess{border-top:6px solid var(--blk)}
.card.sess .wk{color:var(--blk)}
.card.sess .note{background:var(--blks)}
.btn.primary.blkbtn{background:var(--blk);border-color:var(--blk)}
.timer .clock.over{color:var(--sun)}
.card.block{border-left:6px solid var(--blk)}
.card.block .block-h{color:var(--blk)}

nav.tabs .in{grid-template-columns:repeat(6,minmax(0,1fr))}
.dx-strip{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;color:var(--ink)}

.dx-strip .go{color:var(--steel);font-weight:700}
.dx-pbar{display:block;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:8px}

.dx-lbl{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}

.dx-goal .gn{font-weight:700;font-size:16px}

.dx-goal .dx-pbar{height:12px;background:var(--surface)}
.dx-goal .pct{font-family:var(--cond);font-weight:700;font-size:22px;color:var(--steel);white-space:nowrap}
.dx-goal.won .pct{color:var(--green)}
.dx-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dx-ph2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dx-slot{border:2px dashed var(--line);border-radius:12px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--sunk);color:var(--muted);font-weight:600;font-size:14px;overflow:hidden;position:relative;padding:0;width:100%}

.dx-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dx-thumb small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 4px}
.dx-viewer img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--sunk)}
.dx-skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

.fd-four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.fd-chk input{width:20px;height:20px;accent-color:var(--green)}
.fd-tot{background:var(--sunk);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.fd-fav{display:flex;align-items:center;gap:0;border:1px solid var(--line);background:var(--sunk);border-radius:99px;overflow:hidden}

/* Scanner */
.sc-reader{width:100%;min-height:220px;border-radius:12px;overflow:hidden;background:#000}
.sc-reader video{width:100%!important;height:auto!important;display:block}
.sc-reader img[alt="Info icon"],.sc-reader img[alt="Camera based scan"]{display:none!important}
/* Stack */
nav.tabs .in{grid-template-columns:repeat(8,minmax(0,1fr))}
nav.tabs .in button{font-size:10px;padding-left:1px;padding-right:1px;overflow:hidden;text-overflow:ellipsis}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"] svg{width:36px}
.st-row{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.st-tick{flex:0 0 48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:transparent;font-size:22px;font-weight:700}
.st-tick:disabled{opacity:.35}
.st-row.done .st-tick{background:var(--green);border-color:var(--green);color:#fff}
.st-info{flex:1;min-width:0;text-align:left;border:1px solid transparent;background:var(--sunk);border-radius:12px;padding:8px 10px;color:var(--ink);font-size:15px}
.st-row.done .st-info{background:var(--green-soft)}
.st-info small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.st-info .ok{color:var(--green);font-weight:600}
.st-info .late{color:var(--red);font-weight:600}
.st-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.st-cal .h{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0}
.st-day{border:1px solid transparent;background:var(--sunk);border-radius:10px;min-height:46px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font-size:14px;font-weight:600}
.st-day.today{border-color:var(--steel)}
.st-day.sel{background:var(--steel);color:var(--on-accent,#fff)}
.st-day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px}
.st-cal i,.st-key i{display:inline-block;width:6px;height:6px;border-radius:99px}
i.t{background:var(--green)} i.m{background:var(--red)} i.u{background:transparent;box-shadow:inset 0 0 0 1.5px var(--steel)}
.st-day.sel i.u{box-shadow:inset 0 0 0 1.5px currentColor}

<script>
(function(){
/* ================= Program ================= */
const SLOTS=[
  {k:'A', type:'push',L:'A',day:'Day 1'},
  {k:'pA',type:'pull',L:'A',day:'Day 2'},
  {k:'B', type:'push',L:'B',day:'Day 3'},
  {k:'pB',type:'pull',L:'B',day:'Day 4'},
  {k:'C', type:'push',L:'C',day:'Day 5'},
  {k:'pC',type:'pull',L:'C',day:'Day 6'}];
const DAYNAME={};
const PUSH_ACC={A:[],B:[],C:['Incline dumbbell press 3×10']};
const PULL_ACC={A:['Barbell rows 4×8'],B:['Chest-supported rows 3×10'],C:['Dumbbell rows 3×10','Dead hang 2×max (grip)']};
const rep=(n,pct,reps)=>Array.from({length:n},()=>({pct,reps}));
const N=(n,reps,add=0)=>Array.from({length:n},()=>({reps,add}));

function benchPlan(w,d){
  const s={name:'',lift:'Bench press',sets:[],note:'',acc:PUSH_ACC[d]};
  if(w<=4){
    if(d==='A'){s.name='Heavy bench';s.sets=rep(5,[75,77.5,80,70][w-1],5);}
    if(d==='B'){s.name='Volume bench';s.sets=rep(4,[65,67.5,70,60][w-1],8);}
    if(d==='C'){s.name='Close-grip bench';s.lift='Close-grip bench';s.sets=rep(4,[65,67.5,70,62.5][w-1],6);}
    if(w===4)s.note='Lighter week. Move the bar fast and recover.';
  }else if(w<=8){
    const i=w-5;
    if(d==='A'){
      if(w===8){s.name='Bench check-in';s.sets=[{pct:60,reps:5},{pct:75,reps:3},{pct:85,reps:1},{pct:92.5,reps:1},{pct:97.5,reps:1}];
        s.note='Work up to a heavy single. If 97.5% moves easily, add a set and try 100%+. Alternative: 85% for max reps.';}
      else{s.name='Heavy bench';s.sets=rep(5,[82.5,85,87.5][i],3);}
    }
    if(d==='B'){s.name='Volume bench';s.sets=rep(4,[72.5,75,77.5,70][i],6);}
    if(d==='C'){s.name='Paused bench';s.lift='Paused bench (2s pause)';s.sets=rep(4,[70,72.5,75,70][i],4);}
  }else if(w<=11){
    if(d==='A'){s.name='Peak bench';s.sets=w===9?rep(3,90,2):w===10?rep(3,95,1):rep(2,97.5,1);
      s.note=w===11?'Two heavy singles. Full rest (4–5 min) between them.':'Long rests. Every rep should be crisp.';}
    if(d==='B'){s.name='Speed bench';s.sets=rep(3,75,5);}
    if(d==='C'){s.name='Paused bench';s.lift='Paused bench (2s pause)';s.sets=rep(3,75,3);}
  }else{
    if(d==='A'){s.name='Deload';s.sets=rep(3,70,3);s.note='Easy. Leave plenty in the tank.';s.acc=[];}
    if(d==='B'){s.name='Primer';s.sets=rep(2,60,3);s.note='Optional. Just grease the groove, two days before testing.';s.acc=[];}
    if(d==='C'){s.name='Bench test day';s.lift='Bench press 1RM';
      s.sets=[{pct:60,reps:5},{pct:80,reps:3},{pct:95,reps:1},{pct:105,reps:1},{pct:110,reps:1}];
      s.note='Rest 3–5 min between singles. If 110% moves well, add a set and go for 115–120. Use a spotter.';s.acc=[];}
  }
  return s;
}
function dipPlan(w){
  const o={name:'Dips',sets:[],note:''};
  if(w<=4){o.sets=w===4?N(2,10):N([3,3,4][w-1],[10,12,10][w-1]);o.name='Bodyweight dips';if(w===1)o.note='Lean slightly forward, lower until shoulders are just below elbows, and lock out at the top.';}
  else if(w<=7){o.sets=N(4,8,[5,7.5,10][w-5]);o.name='Weighted dips';if(w===5)o.note='Add weight with a dip belt. Keep 1–2 reps in reserve on every set.';}
  else if(w===8){o.sets=N(3,8);o.name='Bodyweight dips';}
  else if(w<=11){o.sets=N(3,6,[10,12.5,15][w-9]);o.name='Weighted dips';}
  else{o.sets=N(2,8);o.name='Easy dips';}
  return o;
}
function curMax(){let m=+S.settings.puMax||10;Object.values(S.sessions).forEach(r=>(r.pull?.sets||[]).forEach(x=>{if(x.max&&x.done&&+x.reps>m)m=+x.reps;}));return m;}
function pullPlan(w,d){
  const CM=curMax(),r=f=>Math.max(1,Math.round(CM*f)),MAX={reps:0,add:0,max:true};
  const o={name:'',lift:'Pull-ups',sets:[],note:'',weighted:false,acc:PULL_ACC[d]};
  if(d==='A'){
    if(w<=4){o.name='Pull-up volume';o.sets=N([5,5,6,4][w-1],r(w===4?.5:.6));if(w===1)o.note='Strict reps: dead hang at the bottom, chin over the bar. Rest 90 seconds between sets.';}
    else if(w<=7){o.name='Pull-up volume';o.sets=N([6,6,7][w-5],r(.65));}
    else if(w===8){o.name='Pull-up max test';o.sets=[MAX,...N(2,r(.5))];o.note='Warm up, then one all-out strict set. Log your reps in the Max set. Later targets adjust to it.';}
    else if(w<=11){o.name='Pull-up volume';o.sets=N([6,7,7][w-9],r(.65));}
    else{o.name='Pull-up final test';o.sets=[MAX];o.acc=[];o.note='The 20-rep attempt. Warm up well, stay strict, and leave nothing in the tank.';}
  }
  if(d==='B'){
    o.name='Heavy lat pulldowns';o.lift='Lat pulldowns';o.load=true;
    if(w<=4)o.sets=N(4,8);
    else if(w<=7)o.sets=N(5,5);
    else if(w===8)o.sets=N(3,5);
    else if(w<=11)o.sets=N(4,4);
    else{o.name='Light lat pulldowns';o.sets=N(2,8);o.acc=[];}
    if(w===1)o.note='Pick a weight that leaves 1–2 reps in the tank. When you hit every rep, add 2.5–5 kg next time.';
    if(w===5)o.note='Heavier block: 5 reps per set. Go up in weight from last week.';
    if(w===9)o.note='Heaviest sets of the program. Strict form, full stretch at the top.';
  }
  if(d==='C'){
    if(w===12)return null;
    if(w===4){o.name='Light pull-ups';o.sets=N(3,r(.5));}
    else{o.name='Max + back-off';o.sets=[MAX,...N(w<=4?3:4,r(w<=4?.5:.6))];if(w===1)o.note='First set to failure with strict form, rest 3 minutes, then the back-off sets. Your best max set raises all future targets.';}
  }
  return o;
}
const ABS={A:['Cable crunches',12],pA:['Hanging knee raises',12],B:['Ab wheel rollouts',10],pB:['Decline sit-ups',12],C:['Russian twists (each side)',12],pC:['Hanging leg raises',10]};
const SH={A:['Lateral raises',15],pA:['Straight-arm pulldowns',12],B:['Overhead press',8],pB:['Dumbbell shrugs',12],C:['Rear-delt flyes',15],pC:['Farmer\u2019s carries',40,'m']};
const OLD_SH={A:'Lateral raises',pA:'Face pulls',B:'Overhead press',pB:'Rear-delt flyes',C:'Lateral raises',pC:'Face pulls'};
const AR={A:['Skull crushers',10],pA:['Incline dumbbell curls',10],B:['Triceps pushdowns',12],pB:['Barbell curls',10],C:['JM press',8],pC:['Hammer curls',10]};
function shPlan(k){const a=SH[k];return {ex:a[0],sets:N(3,a[1]),unit:a[2]||''};}
function arPlan(k){const a=AR[k];return {ex:a[0],sets:N(3,a[1])};}
function absPlan(k){const a=ABS[k];return {name:'ABs',ex:a[0],sets:N(3,a[1])};}
const CUES={
 bench:['Squeeze shoulder blades back and down, keep a slight arch, and drive your feet into the floor.','Touch your lower chest with elbows at about 45–70°, then press up and slightly back over your shoulders.','Breathe in and brace before each rep; keep your glutes on the bench.'],
 closegrip:['Hands about shoulder width apart.','Keep elbows tucked close to your sides and touch slightly lower on the chest.','Drive through your triceps to a full lockout.'],
 paused:['Lower under control and hold completely still on your chest for 2 seconds.','Stay tight through the pause; don’t relax or let the bar sink.','Press explosively once the pause ends.'],
 pullups:['Start from a dead hang with shoulders slightly pulled down, not shrugged.','Drive your elbows down toward your hips until your chin clears the bar.','Lower all the way under control. No kipping or swinging.'],
 dips:['Lean slightly forward with elbows tracking back, not flared out.','Lower until your shoulders are just below your elbows.','Lock out fully at the top without shrugging.'],
 lateral:['Keep a slight bend in the elbows and lead with your elbows, not your hands.','Raise to shoulder height, no higher.','Use a weight you can lower slowly without swinging.'],
 facepull:['Set the rope at upper-chest or face height.','Pull toward your forehead, splitting the rope and rotating your hands back.','Squeeze your rear delts for a second at the end.'],
 ohp:['Squeeze glutes and abs; the bar starts on your front delts.','Move your head back slightly, press straight up, then push your head through at the top.','Don’t lean back to finish a rep.'],
 reardelt:['Hinge forward or lie chest-down on an incline bench.','Keep a slight elbow bend and sweep your arms out wide.','Think “pull apart”, not “lift up”, and pause at the top.'],
 skull:['Lower the bar to your forehead or just behind your head.','Keep your upper arms still, angled slightly back.','Extend fully without flaring your elbows.'],
 inclinecurl:['Set the bench at about 45–60° with arms hanging straight down.','Curl without letting your elbows drift forward.','Lower slowly for a full stretch.'],
 pushdown:['Pin your elbows to your sides.','Push down to a full lockout and squeeze.','Control the return to about 90°.'],
 curl:['Elbows stay at your sides; no swinging.','Curl to just below shoulder height.','Lower under control.'],
 jm:['A hybrid of close-grip bench and skull crusher.','Lower the bar toward your upper chest or chin with elbows pointing forward.','Press back by extending the elbows. Keep it controlled.'],
 hammer:['Palms face each other the whole time.','Keep elbows still and curl to shoulder height.','No swinging; lower slowly.'],
 cablecrunch:['Kneel with the rope beside your head.','Curl your ribs toward your hips; the movement comes from your abs, not your hips.','Pause and squeeze at the bottom.'],
 kneeraise:['Dead hang with shoulders engaged.','Bring knees to chest by curling your pelvis up.','Lower slowly and avoid swinging.'],
 abwheel:['Start on your knees, brace your abs and squeeze your glutes.','Roll out only as far as you can without your lower back sagging.','Pull back using your abs.'],
 situp:['Hook your feet; hold a weight at your chest if needed.','Curl up one vertebra at a time.','Lower under control.'],
 twist:['Lean back to about 45° with your chest up.','Rotate from your torso, not just your arms.','Feet down is easier; feet raised is harder.'],
 legraise:['Dead hang with legs straight or slightly bent.','Raise legs to hip height or higher by tilting your pelvis.','Lower slowly with no swing.'],
 latpd:['Grip just outside shoulder width, thighs locked under the pad.','Pull the bar to your upper chest, driving elbows down and back.','Let it rise to a full stretch under control; don’t lean back to cheat.'],
 rows:['Hinge forward with a flat back.','Pull to your lower ribs, driving elbows back.','Lower under control.'],
 sapd:['Face a high cable with a bar or rope, arms straight and a slight forward lean.','Sweep the bar down to your thighs using your lats, keeping elbows locked.','Squeeze at the bottom, then let it rise slowly to eye level.'],
 shrug:['Stand tall holding heavy dumbbells at your sides.','Lift your shoulders straight up toward your ears; don’t roll them.','Pause one second at the top, then lower slowly.'],
 farmer:['Pick up heavy dumbbells or handles with a neutral spine.','Walk tall with short, quick steps, shoulders back and down.','Don’t let your grip open; set them down under control.']
};
function cueKey(n){n=n.toLowerCase();
  if(n.includes('close-grip'))return 'closegrip';if(n.includes('paused'))return 'paused';if(n.includes('bench press'))return 'bench';
  if(n.includes('lat pulldown'))return 'latpd';if(n.includes('pull-up')||n.includes('chin-up'))return 'pullups';if(n.includes('dip'))return 'dips';if(n.includes('lateral'))return 'lateral';if(n.includes('face pull'))return 'facepull';
  if(n.includes('overhead'))return 'ohp';if(n.includes('rear-delt'))return 'reardelt';if(n.includes('skull'))return 'skull';if(n.includes('incline dumbbell curl'))return 'inclinecurl';

function tickClock(){

  const left=Math.round((timer.end-Date.now())/1000);

function dxBars(vals,labels,target,names){const W=340,H=150,L=26,B=18,mx=Math.max(1,target||0,...vals),bw=(W-L)/vals.length;
  let s=`<svg class="dx-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${vals.map((v,i)=>names[i]+': '+v+' min').join(', ')}"><text x="0" y="10">${mx}</text><text x="0" y="${H-B}">0</text><line x1="${L}" x2="${W}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  vals.forEach((v,i)=>{const bh=(H-B-8)*v/mx,x=L+i*bw+3,ok=target&&v>=target;s+=`<rect x="${x}" y="${H-B-bh}" width="${bw-6}" height="${bh}" rx="3" fill="var(${ok?'--green':'--steel'})"><title>${names[i]}: ${v} min</title></rect><text x="${x+(bw-6)/2}" y="${H-4}" text-anchor="middle">${labels[i]}</text>`;});
  if(target){const y=H-B-(H-B-8)*target/mx;s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;}

/* ----- Goals ----- */
const DXG={
  bench:{n:'Bench press (heaviest set)',u:'kg',step:0.5},
  pullups:{n:'Pull-ups in one set',u:'reps'},
  pushups:{n:'Push-ups in one set',u:'reps'},
  dips:{n:'Dips in one set',u:'reps'},
  weight:{n:'Body weight',u:'kg',step:0.1},
  squat:{n:'Squat',u:'kg',step:0.5},
  deadlift:{n:'Deadlift',u:'kg',step:0.5},
  rundist:{n:'Run distance in one go',u:'km',step:0.1},
  run5k:{n:'5 km run time',u:'minutes',dir:'down',step:0.1},
  weekmin:{n:'Active minutes in a week',u:'min'},
  custom:{n:'Something else (custom)'}
};
const dxGd=g=>DXG[g.type]||DXG.custom,dxGu=g=>g.type==='custom'?(g.unit||''):dxGd(g).u,dxGn=g=>g.type==='custom'?(g.name||'Custom goal'):dxGd(g).n;
function dxLatestW(){const W=[...(S.bw||[])].sort((a,b)=>a.date.localeCompare(b.date));return W.length?+W[W.length-1].kg:null;}
function dxAuto(t){let m=null;const up=v=>{v=+v;if(v>0&&(m===null||v>m))m=v;};
  if(t==='weight')return dxLatestW();
  if(t==='weekmin'){const E=dxEntries(),mon=dxAdd(today(),-((new Date().getDay()+6)%7));return E.filter(e=>e.date>=mon).reduce((a,e)=>a+(+e.min||0),0);}
  if(t==='rundist'){dxActs().forEach(a=>{if(/run|jog/i.test(a.type))up(a.dist);});return m;}
  if(t==='pushups'){pushSets().forEach(x=>up(x.reps));allDone().forEach(o=>{if(/push-?up/i.test(o.name))up(o.r);});return m;}
  const all=allDone();
  if(t==='bench')all.forEach(o=>{if(o.name==='bench press'||/bench press/.test(o.name)&&o.sec==='b')up(o.w);});
  if(t==='pullups')all.forEach(o=>{if(o.sec==='p'&&/pull-?up|chin-?up/i.test(o.name))up(o.r);});
  if(t==='dips')all.forEach(o=>{if(/dip/i.test(o.name))up(o.r);});
  if(t==='squat')all.forEach(o=>{if(/squat/i.test(o.name))up(o.w);});
  if(t==='deadlift')all.forEach(o=>{if(/deadlift/i.test(o.name))up(o.w);});
  return m;}
function dxDir(g){if(g.type==='custom')return g.dir||'up';if(dxGd(g).dir)return dxGd(g).dir;if(g.type==='weight')return +g.target<+g.start?'down':'up';return 'up';}
function dxCur(g){if(g.type==='weight'){const w=dxLatestW();return w===null?+g.start:w;}if(g.type==='weekmin')return dxAuto('weekmin');
  const vals=(g.log||[]).map(x=>+x.val).filter(v=>!isNaN(v)),a=dxAuto(g.type);if(a!==null&&a!==undefined)vals.push(a);if(!vals.length)return +g.start;
  return dxDir(g)==='down'?Math.min(...vals):Math.max(...vals);}
function dxPct(g,c){const st=+g.start,tg=+g.target,dn=dxDir(g)==='down';if(c===null||isNaN(tg))return 0;if(dn?c<=tg:c>=tg)return 100;if(st===tg)return 0;
  const p=dn?(st-c)/(st-tg):(c-st)/(tg-st);return Math.max(0,Math.min(100,Math.round(p*100)));}
let dxGOpen=null,dxGEdit=null;
function dxGoalsCard(){const G=dxGoals();let newly=null;
  let h=`<div class="card"><div class="dx-head"><p class="h2" style="margin:0">Goals</p><button class="btn primary" style="min-height:40px;padding:6px 14px" data-dx="gnew">+ Add goal</button></div>`;
  if(!G.length)h+=`<p class="sub" style="margin-top:8px">Set targets like a heavier bench, more pull-ups or a longer run. Goals linked to your lifts update automatically as you tick sets.</p>`;
  G.forEach(g=>{const c=dxCur(g),p=dxPct(g,c),u=dxGu(g),won=p>=100;if(won&&!g.done){g.done=today();newly=g;}if(!won&&g.done)g.done='';
    let due='';if(g.by&&!won){const dl=Math.round((new Date(g.by+'T00:00')-new Date(today()+'T00:00'))/864e5);due=dl<0?' · target date passed':dl<14?` · ${dl} day${dl===1?'':'s'} left`:` · ${Math.round(dl/7)} weeks left`;}
    h+=`<div class="dx-goal ${won?'won':''}"><div class="gt"><div><div class="gn">${won?'🏆 ':''}${dxEsc(dxGn(g))}: ${dxN(g.target)} ${dxEsc(u)}</div>
    <div class="gm">Now <b>${dxN(c)} ${dxEsc(u)}</b> · started at ${dxN(g.start)}${g.by?' · by '+dxFmtD(g.by):''}${due}${won?' · reached '+dxFmtD(g.done)+' 🎉':''}</div></div><span class="pct">${p}%</span></div>
    <span class="dx-pbar"><span style="width:${p}%"></span></span>
    <div class="row" style="margin-top:8px;gap:8px">${g.type==='weekmin'?'':`<button class="btn" style="min-height:38px;padding:6px 12px" data-dx="glog" data-id="${g.id}">${g.type==='weight'?'Log weight':'Log a result'}</button>`}<button class="btn ghost" style="min-height:38px;padding:6px 12px" data-dx="gedit" data-id="${g.id}">Edit</button></div>

  if(newly){save();setTimeout(()=>{dxToast('🎉 Goal reached: '+dxGn(newly)+'!');try{confetti();}catch(e){}},300);}
  return h+'</div>';}
function dxOpenGoal(id){dxGEdit=id||null;const g=id?dxGoals().find(x=>x.id===id):null,t=g?g.type:'bench';

  <div class="field"><label for="dxgdir" style="font-size:13px">Better is</label><select id="dxgdir"><option value="up">Higher</option><option value="down" ${g&&g.dir==='down'?'selected':''}>Lower</option></select></div></div></div>

function fdCalc(){const F=fdS(),B=dxBody(),w=fdWeight(),h=+B.height,a=+B.age;
  if(!(w>0&&h>0&&a>0&&F.sex))return null;
  const bmr=10*w+6.25*h-5*a+(F.sex==='m'?5:-161),burn=bmr*(+F.act||1.55);

  const p=Math.round(w*(F.goal==='maintain'?1.8:2)),f=Math.round(kcal*.25/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {kcal,p,c,f,bmr:Math.round(bmr),burn:Math.round(burn)};}
function fdTarget(){const F=fdS();if(F.tgt&&F.tgt.manual)return F.tgt;return fdCalc();}
function fdSum(list){return list.reduce((a,e)=>{const q=+e.qty||1;a.kcal+=(+e.kcal||0)*q;a.p+=(+e.p||0)*q;a.c+=(+e.c||0)*q;a.f+=(+e.f||0)*q;return a;},{kcal:0,p:0,c:0,f:0});}

function fdWeekCard(T){const td=today(),days=[...Array(7)].map((_,i)=>dxAdd(td,i-6)),sums=days.map(d=>fdSum(fdS().log[d]||[])),logged=sums.filter(s=>s.kcal>0);

function fdMatches(q){q=q.trim().toLowerCase();const F=fdS(),seen=new Set(),out=[];

/* ================= Barcode scanner ================= */
/* Camera scanning uses the html5-qrcode library (works on iPhone Safari), loaded only when you tap Scan.
   Product lookups use Open Food Facts. Every product you scan or type in is remembered on this device. */
const SC_LIB='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
let scCur=null,scQr=null,scBusy=false;
function scCodes(){const F=fdS();if(!F.codes||typeof F.codes!=='object')F.codes={};return F.codes;}
function scLoadLib(){if(window.__Html5QrcodeLibrary__)return Promise.resolve(window.__Html5QrcodeLibrary__);
  if(scLoadLib.p)return scLoadLib.p;
  scLoadLib.p=new Promise((res,rej)=>{const s=document.createElement('script');s.src=SC_LIB;s.async=true;
    s.onload=()=>window.__Html5QrcodeLibrary__?res(window.__Html5QrcodeLibrary__):rej(new Error('lib'));
    s.onerror=()=>{scLoadLib.p=null;s.remove();rej(new Error('lib'));};document.head.appendChild(s);});
  return scLoadLib.p;}
async function scStop(){const q=scQr;scQr=null;if(q){try{await q.stop();}catch(e){}try{q.clear();}catch(e){}}}
async function scOpen(){scBusy=false;
  $('#dxscbody').innerHTML=`<div id="screader" class="sc-reader"></div><p class="sub" id="scmsg" style="text-align:center;margin-top:8px">Starting camera…</p>
  <p class="dx-lbl">Or type the barcode number</p><div class="xadd"><input class="input" id="sccode" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="e.g. 9400547001017" aria-label="Barcode number"><button class="btn primary" data-sc="lookup">Look up</button></div>`;
  dxShow('sc');
  try{const L=await scLoadLib();if($('#dxscsheet').hidden)return;
    const Fm=L.Html5QrcodeSupportedFormats;
    scQr=new L.Html5Qrcode('screader',{formatsToSupport:[Fm.EAN_13,Fm.EAN_8,Fm.UPC_A,Fm.UPC_E],verbose:false});
    await scQr.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.max(120,Math.min(300,Math.round(w*.85))),height:Math.max(80,Math.min(170,Math.round(h*.6)))})},code=>scGot(code),()=>{});
    if($('#dxscsheet').hidden){scStop();return;}
    const m=$('#scmsg');if(m)m.textContent='Point the camera at the barcode and hold steady.';
  }catch(err){scQr=null;const m=$('#scmsg');if(!m)return;
    m.textContent=String(err&&err.message||err)==='lib'?'Couldn’t load the scanner. Check your connection, or type the number below.':'Camera not available. Allow camera access for this site (iPhone Settings → Apps → Safari → Camera), or type the number below.';}}
async function scClose(){await scStop();dxHide('sc');}
async function scGot(code){if(scBusy)return;scBusy=true;await scClose();scLookup(code);}
function scNum(n,k){const v=parseFloat(n[k]);return isFinite(v)?v:null;}
function scFromOFF(p,code){const n=p.nutriments||{};
  const kcal=s=>{const k=scNum(n,'energy-kcal'+s);if(k!==null)return k;const kj=scNum(n,'energy-kj'+s)??scNum(n,'energy'+s);return kj===null?null:kj/4.184;};
  const per100={kcal:kcal('_100g'),p:scNum(n,'proteins_100g'),c:scNum(n,'carbohydrates_100g'),f:scNum(n,'fat_100g')};
  const has=Object.values(per100).some(v=>v!==null);
  const pname=String(p.product_name_en||p.product_name||'').trim(),brand=String(p.brands||'').split(',')[0].trim();
  let name=(brand&&!pname.toLowerCase().includes(brand.toLowerCase())?brand+' ':'')+pname;name=name.trim()||'Product '+code;
  const g=parseFloat(p.serving_quantity);
  return {name:name.slice(0,60),per100:has?per100:null,srvG:g>0?g:null,srvLabel:String(p.serving_size||'').slice(0,30)};}
async function scLookup(code){code=String(code||'').replace(/\D/g,'');if(code.length<6){dxToast('That barcode looks too short');return;}
  const known=scCodes()[code];if(known){scApply(code,known,true);return;}
  const bs=$('#fdbasis');if(bs)bs.innerHTML='<div class="note" style="margin-top:10px">Looking up '+code+'…</div>';
  let info=null;
  try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,product_name_en,brands,serving_size,serving_quantity,nutriments');
    if(r.ok){const j=await r.json();if(j&&j.status===1&&j.product)info=scFromOFF(j.product,code);}

  scApply(code,info,false);}
function scApply(code,info,saved,offline){scCur={code,info,basis:null,g:0};const nm=$('#fdname'),bs=$('#fdbasis');if(!nm||!bs)return;
  const res=$('#fdres');if(res)res.innerHTML='';
  if(!info){nm.value='';fdFill({});
    bs.innerHTML=`<div class="note" style="margin-top:10px">${offline?'Couldn’t reach the food database (no connection?).':'Barcode <b>'+code+'</b> isn’t in the food database yet.'} Type the name and the numbers from the nutrition panel once, and it’s remembered the next time you scan it.</div>`;
    setTimeout(()=>nm.focus(),50);return;}
  nm.value=info.name;
  if(info.per100){const opts=[];if(info.srvG)opts.push(['srv','1 serving ('+fdN1(info.srvG)+' g)']);opts.push(['100','100 g']);
    bs.innerHTML=`<div class="note" style="margin-top:10px">${saved?'Scanned before':'Found'}: <b>${esc(info.name)}</b>${info.srvLabel?' · serving size '+esc(info.srvLabel):''}${info.per100.kcal===null?'<br>No calorie figure listed. Check the packet.':''}</div>
    <p class="dx-lbl">How much?</p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="dx-chips" id="scbasis">${opts.map(([k,l])=>`<button class="dx-chip" data-sc="basis" data-b="${k}" aria-pressed="false">${l}</button>`).join('')}</div><input class="input" id="scg" type="number" inputmode="decimal" min="1" placeholder="grams" style="width:90px;text-align:center" aria-label="Amount in grams"></div>`;
    if(info.lastG){$('#scg').value=fdN1(info.lastG);scBasis('g');}else scBasis(info.srvG?'srv':'100');}
  else if(info.srv){bs.innerHTML=`<div class="note" style="margin-top:10px">Scanned before: <b>${esc(info.name)}</b></div>`;fdFill(info.srv);}
  else{fdFill({});bs.innerHTML=`<div class="note" style="margin-top:10px">Found <b>${esc(info.name)}</b>, but it has no nutrition info listed. Add the numbers from the packet once and it’s remembered.</div>`;}}
function scBasis(k){const c=scCur;if(!c||!c.info||!c.info.per100)return;c.basis=k;
  const g=k==='srv'?c.info.srvG:k==='100'?100:(parseFloat(($('#scg')||{}).value)||0);
  document.querySelectorAll('#scbasis .dx-chip').forEach(b=>{const on=b.dataset.b===k;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  if(k!=='g'&&$('#scg'))$('#scg').value='';

  fdFill({kcal:P.kcal===null?'':Math.round(P.kcal*f),p:v(P.p),c:v(P.c),f:v(P.f)});}
/* Called from fdSave: remember the product for next time and label the amount */
function scRemember(o){const c=scCur;if(!c)return;const codes=scCodes(),base=o.name;
  if(c.info&&c.info.per100){codes[c.code]=Object.assign({},c.info,{name:base,lastG:c.basis==='g'&&c.g>0?c.g:undefined});
    if(c.g>0)o.name=base+' ('+fdN1(c.g)+' g)';}
  else codes[c.code]={name:base,srv:{kcal:o.kcal,p:o.p,c:o.c,f:o.f}};
  scCur=null;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-sc]');if(!b)return;const a=b.dataset.sc;
  if(a==='open'){scOpen();return;}
  if(a==='close'){scClose();return;}

/* ================= Stack: supplements & peptides ================= */
const ST_UNITS=['mg','mcg','g','IU','ml','units','caps','tabs','scoops','drops'];
const ST_WD=['Mo','Tu','We','Th','Fr','Sa','Su'],ST_WDI=[1,2,3,4,5,6,0]; /* Monday-first, mapped to getDay() */
const ST_ICS=['SU','MO','TU','WE','TH','FR','SA'];
let stMonth=null,stSel=null,stEdit=null;
function stS(){if(!S.stack||typeof S.stack!=='object')S.stack={};const T=S.stack;if(!Array.isArray(T.items))T.items=[];if(!T.log||typeof T.log!=='object')T.log={};return T;}
const stDiff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const stWd=d=>new Date(d+'T00:00').getDay();
const stTaken=(it,d)=>{const L=stS().log[d];return !!(L&&L[it.id]);};
function stLastTaken(it,before){const L=stS().log;let best=null;for(const d in L){if(d<before&&L[d]&&L[d][it.id]&&(!best||d>best))best=d;}return best;}
const stOn=(it,d)=>!it.paused&&d>=it.start&&(!it.end||d<=it.end);
function stDue(it,d){if(!stOn(it,d))return false;
  if(it.type==='every'){const n=Math.max(1,+it.n||1),a=stLastTaken(it,d);return stDiff(a||it.start,d)%n===0;}
  return (it.days||[]).includes(stWd(d));}
/* Next date it's due. For every-N items this counts from the last time you took it, so it can be in the past (overdue). */
function stNext(it){const td=today();if(it.paused)return null;
  if(it.type==='every'){const n=Math.max(1,+it.n||1),a=stLastTaken(it,dxAdd(td,1)),nx=a?dxAdd(a,n):it.start;return it.end&&nx>it.end?null:nx;}
  let d=stTaken(it,td)?dxAdd(td,1):td;if(d<it.start)d=it.start;
  for(let i=0;i<7;i++){const x=dxAdd(d,i);if(it.end&&x>it.end)return null;if((it.days||[]).includes(stWd(x)))return x;}return null;}
function stSched(it){if(it.type==='every'){const n=+it.n||1;return n===1?'Every day':'Every '+n+' days';}
  const ds=it.days||[];if(ds.length===7)return 'Every day';return ST_WDI.filter(i=>ds.includes(i)).map(i=>ST_WD[ST_WDI.indexOf(i)]).join(', ')||'No days set';}
const stDose=it=>(it.dose!==''&&it.dose!==undefined?fdN1(it.dose)+' '+esc(it.unit||''):'').trim();
const stTime=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return (h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+(h<12?'am':'pm');};
const stSort=(a,b)=>(a.time||'99').localeCompare(b.time||'99')||a.name.localeCompare(b.name);
function stTodayItems(){const td=today();return stS().items.filter(it=>{if(stTaken(it,td)||stDue(it,td))return true;const nx=it.type==='every'&&stNext(it);return nx&&nx<td&&stOn(it,td);}).sort(stSort);}
function stRow(it,d){const td=today(),tk=stS().log[d]&&stS().log[d][it.id],nx=stNext(it);
  let st='';if(tk)st=`<span class="ok">Taken${tk.t?' '+stTime(tk.t):''}</span>`;
  else if(d===td&&it.type==='every'&&nx&&nx<td)st=`<span class="late">Overdue ${stDiff(nx,td)} day${stDiff(nx,td)>1?'s':''}</span>`;
  else if(d<td)st='<span class="late">Missed</span>';
  else st=it.time?'Due '+stTime(it.time):'Due';
  const can=d<=td;
  return `<div class="st-row ${tk?'done':''}"><button class="st-tick" ${can?'':'disabled'} data-st="tick" data-id="${it.id}" data-d="${d}" aria-pressed="${!!tk}" aria-label="${tk?'Untick':'Mark taken'}: ${esc(it.name)}">✓</button>
  <button class="st-info" data-st="edit" data-id="${it.id}"><b>${esc(it.name)}</b>${stDose(it)?' · '+stDose(it):''}<small>${esc(it.kind||'Supplement')} · ${stSched(it)} · ${st}</small></button></div>`;}
function stCal(){const td=today(),T=stS();if(!stMonth)stMonth=td.slice(0,7);if(!stSel)stSel=td;
  const [y,m]=stMonth.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7;
  let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let i=1;i<=days;i++){const d=stMonth+'-'+String(i).padStart(2,'0');let tk=0,due=0,miss=0;
    T.items.forEach(it=>{if(stTaken(it,d))tk++;else if(stDue(it,d)){if(d<td)miss++;else due++;}});
    const dots='<i class="t"></i>'.repeat(Math.min(tk,4))+'<i class="m"></i>'.repeat(Math.min(miss,4))+'<i class="u"></i>'.repeat(Math.min(due,4));
    cells+=`<button class="st-day ${d===td?'today':''} ${d===stSel?'sel':''}" data-st="day" data-d="${d}" aria-label="${dxDay(d)}: ${tk} taken, ${due} due, ${miss} missed"><span>${i}</span><span class="dots">${dots}</span></button>`;}
  const mname=first.toLocaleDateString('en-NZ',{month:'long',year:'numeric'});
  const sel=T.items.filter(it=>stTaken(it,stSel)||stDue(it,stSel)).sort(stSort);
  return `<div class="card"><div class="fd-nav" style="margin-bottom:6px"><button class="iconbtn" data-st="mprev" aria-label="Previous month">‹</button><div class="d">${mname}</div><button class="iconbtn" data-st="mnext" aria-label="Next month">›</button></div>
  <div class="st-cal">${ST_WD.map(w=>`<span class="h">${w}</span>`).join('')}${cells}</div>
  <p class="st-key"><span><i class="t"></i>Taken</span><span><i class="u"></i>Due</span><span><i class="m"></i>Missed</span></p>
  <p class="dx-lbl">${dxDay(stSel)}</p>${sel.length?sel.map(it=>stRow(it,stSel)).join(''):'<p class="sub">Nothing scheduled.</p>'}</div>`;}
function renderStack(){const T=stS(),td=today(),list=stTodayItems(),left=list.filter(it=>!stTaken(it,td)).length;
  let h=`<div class="card"><p class="h2" style="margin:0">Today</p><p class="sub">${T.items.length?(list.length?(left?left+' still to take':'All done for today ✓'):'Nothing due today.'):'Add your supplements and peptides to track what’s due and when to take them again.'}</p>
  <div style="margin-top:8px">${list.map(it=>stRow(it,td)).join('')}</div>
  <button class="btn primary full" style="margin-top:12px" data-st="new">+ Add supplement or peptide</button></div>`;
  if(T.items.length){h+=stCal();
    h+=`<div class="card"><p class="h2" style="margin:0">Your stack</p><p class="sub">Tap one to edit, pause or delete it.</p><div style="margin-top:8px">${[...T.items].sort(stSort).map(it=>{const nx=stNext(it);
      return `<button class="dx-entry" data-st="edit" data-id="${it.id}"><span><b>${esc(it.name)}</b>${stDose(it)?' · '+stDose(it):''}${it.time?' · '+stTime(it.time):''}<small>${esc(it.kind||'Supplement')} · ${stSched(it)} · ${it.paused?'Paused':nx?(nx<td?'Overdue since '+dxDay(nx):'Next: '+dxDay(nx)):'Finished'}${it.end&&!it.paused?' · ends '+dxFmtD(it.end):''}</small></span><span aria-hidden="true">›</span></button>`;}).join('')}</div></div>`;
    h+=`<div class="card"><p class="h2" style="margin:0">Phone reminders</p><p class="sub">Adds each item to your iPhone Calendar as a repeating event with an alert at its time. Open the downloaded file and tap <b>Add All</b>. If you change your stack, delete the old events and add them again.</p>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-st="ics">Download calendar file</button>${navigator.canShare?'<button class="btn" data-st="icsshare">Share…</button>':''}</div>
    <p class="sub" style="margin-top:8px">“Every N days” reminders follow a fixed rhythm from the next due date. If you take a dose late, the app’s schedule shifts but the calendar doesn’t.</p></div>`;}
  h+='<p class="sub" style="text-align:center;margin:4px 8px 0">This tracker just records what you enter. It doesn’t check doses or interactions.</p>';
  $('#v-stack').innerHTML=h;}
/* ----- Add / edit sheet ----- */
function stOpen(id){const it=id?stS().items.find(x=>x.id===id):null;stEdit=it?it.id:null;
  const f=it?JSON.parse(JSON.stringify(it)):{name:'',kind:'Supplement',dose:'',unit:'mg',time:'08:00',type:'days',days:[0,1,2,3,4,5,6],n:2,start:today(),end:'',notes:'',paused:false};
  stOpen.f=f;
  $('#dxst-h').textContent=it?'Edit item':'Add to your stack';
  $('#dxstbody').innerHTML=`<div class="dx-chips" id="stkind">${['Supplement','Peptide','Medication','Other'].map(k=>`<button class="dx-chip ${f.kind===k?'on':''}" data-st="kind" data-k="${k}" aria-pressed="${f.kind===k}">${k}</button>`).join('')}</div>
  <p class="dx-lbl">Name</p><input class="input" id="stname" style="width:100%" maxlength="40" value="${esc(f.name)}" placeholder="e.g. Creatine" aria-label="Name">
  <div class="dx-two" style="margin-top:10px"><div class="field"><label for="stdose" style="font-size:13px">Dose</label><div style="display:flex;gap:6px"><input class="input" id="stdose" type="number" inputmode="decimal" min="0" step="any" style="width:100%;min-width:0" value="${esc(f.dose)}"><select id="stunit" aria-label="Unit">${ST_UNITS.map(u=>`<option ${f.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div>
  <div class="field"><label for="sttime" style="font-size:13px">Time</label><input class="input" id="sttime" type="time" value="${esc(f.time)}"></div></div>
  <p class="dx-lbl">How often?</p><div class="dx-chips" id="sttype"><button class="dx-chip ${f.type==='days'?'on':''}" data-st="type" data-t="days" aria-pressed="${f.type==='days'}">Set days of the week</button><button class="dx-chip ${f.type==='every'?'on':''}" data-st="type" data-t="every" aria-pressed="${f.type==='every'}">Every few days</button></div>
  <div id="stschedbox" style="margin-top:8px"></div>
  <div class="dx-two" style="margin-top:10px"><div class="field"><label for="ststart" style="font-size:13px">Start date</label><input class="input" id="ststart" type="date" value="${esc(f.start)}"></div>
  <div class="field"><label for="stend" style="font-size:13px">End date (optional)</label><input class="input" id="stend" type="date" value="${esc(f.end||'')}"></div></div>
  <p class="dx-lbl">Notes</p><textarea id="stnotes" maxlength="300" placeholder="e.g. with food, before bed, store in fridge">${esc(f.notes||'')}</textarea>
  ${it?`<label class="fd-chk"><input type="checkbox" id="stpaused" ${f.paused?'checked':''}> Paused (hide from today and the calendar)</label>`:''}
  <button class="btn primary full" style="margin-top:12px" data-st="save">${it?'Save changes':'Add to stack'}</button>
  ${it?`<button class="btn ghost full" style="margin-top:8px;color:var(--red)" data-st="del">Delete ${esc(it.name)}</button>`:''}`;
  stSchedBox();dxShow('st');}
function stSchedBox(){const f=stOpen.f,box=$('#stschedbox');if(!box)return;
  box.innerHTML=f.type==='every'?`<div style="display:flex;gap:10px;align-items:center"><span>Every</span><input class="input" id="stn" type="number" inputmode="numeric" min="1" max="60" value="${esc(f.n||2)}" style="width:80px;text-align:center" aria-label="Number of days"><span>days</span></div><p class="sub" style="margin-top:6px">Counts from the last time you took it, so a late dose moves the next one.</p>`
  :`<div class="dx-chips">${ST_WD.map((w,i)=>{const on=(f.days||[]).includes(ST_WDI[i]);return `<button class="dx-chip ${on?'on':''}" data-st="wd" data-i="${ST_WDI[i]}" aria-pressed="${on}">${w}</button>`;}).join('')}</div>
  <div class="row" style="margin-top:6px"><button class="btn ghost" data-st="wdall">Every day</button><button class="btn ghost" data-st="wdmwf">Mon, Wed, Fri</button><button class="btn ghost" data-st="wdwk">Weekdays</button></div>`;}
function stRead(){const f=stOpen.f;f.name=$('#stname').value.trim().replace(/\s+/g,' ');f.dose=$('#stdose').value;f.unit=$('#stunit').value;f.time=$('#sttime').value;
  f.start=$('#ststart').value||today();f.end=$('#stend').value||'';f.notes=$('#stnotes').value.trim();if($('#stn'))f.n=Math.max(1,parseInt($('#stn').value)||1);if($('#stpaused'))f.paused=$('#stpaused').checked;return f;}
function stSave(){const f=stRead(),T=stS();if(!f.name){dxToast('Give it a name');return;}
  if(f.type==='days'&&!(f.days||[]).length){dxToast('Pick at least one day');return;}
  if(f.end&&f.end<f.start){dxToast('End date is before the start date');return;}
  if(stEdit){const i=T.items.findIndex(x=>x.id===stEdit);if(i>=0)T.items[i]=Object.assign(T.items[i],f);}
  else T.items.push(Object.assign({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},f));
  save();dxHide('st');renderStack();dxToast(stEdit?'Saved ✓':f.name+' added ✓');}
/* ----- Calendar file (.ics) ----- */
function stIcs(){const T=stS(),td=today(),stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',tx=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Double Twenty//Stack//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Double Twenty stack'];let n=0;
  T.items.filter(it=>!it.paused&&(!it.end||it.end>=td)).forEach(it=>{let d=stNext(it);if(!d)return;if(d<td)d=td;
    const t=(it.time||'08:00').replace(':','')+'00',ds=d.replace(/-/g,'');
    const rule=it.type==='every'?'FREQ=DAILY;INTERVAL='+Math.max(1,+it.n||1):'FREQ=WEEKLY;BYDAY='+(it.days||[]).map(i=>ST_ICS[i]).join(',');
    const sum=(it.kind==='Peptide'?'💉 ':'💊 ')+it.name+(it.dose!==''?' '+fdN1(it.dose)+' '+(it.unit||''):'');
    L.push('BEGIN:VEVENT','UID:'+it.id+'@double-twenty','DTSTAMP:'+stamp,'DTSTART:'+ds+'T'+t,'DURATION:PT10M','RRULE:'+rule+(it.end?';UNTIL='+it.end.replace(/-/g,'')+'T235959':''),
      'SUMMARY:'+tx(sum),...(it.notes?['DESCRIPTION:'+tx(it.notes)]:[]),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+tx(sum),'TRIGGER:-PT0M','END:VALARM','END:VEVENT');n++;});
  L.push('END:VCALENDAR');return {text:L.join('\r\n')+'\r\n',n};}
async function stIcsOut(share){const {text,n}=stIcs();if(!n){dxToast('Nothing active to add');return;}
  const name='double-twenty-stack.ics';
  if(share){try{const f=new File([text],name,{type:'text/calendar'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Double Twenty stack'});return;}}catch(e){if(e&&e.name==='AbortError')return;}}
  try{const a=document.createElement('a');a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(text);a.download=name;document.body.appendChild(a);a.click();a.remove();dxToast('Calendar file ready: '+n+' item'+(n>1?'s':''));}catch(e){dxToast('Download not available here');}}
/* ----- Events ----- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(!b)return;const a=b.dataset.st,T=stS();
  if(a==='go'){show('stack');return;}
  if(a==='new'){stOpen(null);return;}
  if(a==='edit'){stOpen(b.dataset.id);return;}
  if(a==='tick'){const d=b.dataset.d,id=b.dataset.id;if(d>today())return;T.log[d]=T.log[d]||{};
    if(T.log[d][id])delete T.log[d][id];else{const n=new Date();T.log[d][id]={t:d===today()?String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'):''};}
    if(!Object.keys(T.log[d]).length)delete T.log[d];save();if(view==='stack')renderStack();else renderToday();return;}
  if(a==='day'){stSel=b.dataset.d;renderStack();return;}
  if(a==='mprev'||a==='mnext'){const [y,m]=stMonth.split('-').map(Number),x=new Date(y,m-1+(a==='mnext'?1:-1),1);stMonth=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');renderStack();return;}
  if(a==='ics'){stIcsOut(false);return;}
  if(a==='icsshare'){stIcsOut(true);return;}
  const f=stOpen.f;if(!f)return;
  if(a==='kind'){f.kind=b.dataset.k;document.querySelectorAll('#stkind .dx-chip').forEach(c=>{const on=c.dataset.k===f.kind;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);});return;}
  if(a==='type'){stRead();f.type=b.dataset.t;document.querySelectorAll('#sttype .dx-chip').forEach(c=>{const on=c.dataset.t===f.type;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on);});stSchedBox();return;}
  if(a==='wd'){const i=+b.dataset.i;f.days=f.days||[];f.days=f.days.includes(i)?f.days.filter(x=>x!==i):[...f.days,i];stSchedBox();return;}
  if(a==='wdall'){f.days=[0,1,2,3,4,5,6];stSchedBox();return;}
  if(a==='wdmwf'){f.days=[1,3,5];stSchedBox();return;}
  if(a==='wdwk'){f.days=[1,2,3,4,5];stSchedBox();return;}
  if(a==='save'){stSave();return;}
  if(a==='del'){const i=T.items.findIndex(x=>x.id===stEdit);if(i<0)return;const [gone]=T.items.splice(i,1);save();dxHide('st');renderStack();
    dxToast(gone.name+' deleted',()=>{T.items.splice(i,0,gone);save();renderStack();});return;}
});
/* Session tab: a strip showing what's still due today */
const stRT=renderToday;renderToday=function(){stRT();try{const td=today(),left=stTodayItems().filter(it=>!stTaken(it,td));if(!left.length)return;
  const v=$('#v-today'),strip=`<button class="dx-strip st-strip" data-st="go"><span>Stack: <b>${left.length}</b> still to take today</span><span class="go">${left.slice(0,2).map(it=>esc(it.name)).join(', ')}${left.length>2?'…':''} ›</span></button>`;
  const after=v.querySelector('.dx-strip');if(after)after.insertAdjacentHTML('afterend',strip);else v.insertAdjacentHTML('afterbegin',strip);}catch(e){}};

const RN={today:renderToday,activity:renderActivity,food:renderFood,stack:renderStack,plan:renderPlan,progress:renderProgress,cali:renderCali,settings:renderSettings};
let view='today';
function show(v){view=v;document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));RN[v]();window.scrollTo({top:0});}
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v);});

setSync(S.updatedAt?'Saved on this device':'Ready');
const TH=['auto','dark','light'],THL={auto:'◐ Auto',dark:'☾ Dark',light:'☀ Light'};
function applyTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);$('#themebtn').textContent=THL[t];}
let theme='auto';try{theme=localStorage.getItem('bench120.theme')||'auto';}catch(e){}
applyTheme(theme);
$('#themebtn').addEventListener('click',()=>{theme=TH[(TH.indexOf(theme)+1)%3];try{localStorage.setItem('bench120.theme',theme);}catch(e){}applyTheme(theme);});
const SKL={graphite:'◼ Graphite',camo:'✪ Camo',melon:'🍉 Melon'};
function applySkin(k){if(!SKL[k])k='graphite';document.documentElement.setAttribute('data-skin',k);$('#skinbtn').textContent=SKL[k];const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',k==='camo'?'#1D2217':k==='melon'?'#D42A45':'#0E0F11');}
let skin='graphite';try{skin=localStorage.getItem('bench120.skin')||'graphite';}catch(e){}if(skin==='electric')skin='graphite';
applySkin(skin);
$('#skinbtn').addEventListener('click',()=>{skin=skin==='graphite'?'camo':skin==='camo'?'melon':'graphite';try{localStorage.setItem('bench120.skin',skin);}catch(e){}applySkin(skin);toast(SKL[skin].replace(/^\S+ /,'')+' mode');if(view==='settings')renderSettings();});
if(needSave){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
syncSeg();
renderToday();
tickSession();
updFab();
(async()=>{try{if(window.claude&&claude.use){sampleFn=await claude.use('sample');if(sampleFn&&view==='progress')renderProgress();}}catch(e){sampleFn=null;}})();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    docRef=db.doc('data/users/'+uid+'/tracker');
    const snap=await docRef.get();
    if(snap.exists){const remote=snap.data();
      if((remote.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blank(),JSON.parse(JSON.stringify(remote)));const was=S.v;fixS();try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}cur=null;RN[view]();syncSeg();if(was!==2)save();}
      else if((S.updatedAt||0)>(remote.updatedAt||0))save();
      setSync('Saved to your account');}
    else if(S.updatedAt)save();else setSync('Synced to your account');
    if(view==='settings')renderSettings();
  }catch(e){docRef=null;}
})();
})();
</script>
